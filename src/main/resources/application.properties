spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roamsafe_db}
spring.datasource.username=${DB_USER:mac2}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google Sheets Webhook URL
google.sheets.webhook.url=${GOOGLE_SHEETS_URL:}

# Server Configuration (hosts like Railway/Render/Fly/Brimble inject $PORT).
# Bind all interfaces explicitly: PaaS health checks reach the container from
# outside, so listening only on localhost would make the app unreachable.
server.port=${PORT:8080}
server.address=0.0.0.0

# Logging
logging.level.com.roamsafe=DEBUG
logging.level.org.springframework.web=DEBUG

# Dev Tools
spring.thymeleaf.cache=false

# --- API keys ---
# Both are deliberately empty by default. An unset key authenticates nobody, so
# a deployment that forgot to set one is locked rather than wide open on a
# value that anyone can read here.
#
# ROAMSAFE_API_KEY   - partner read access to /api/v1 (the MCP server and REST
#                      consumers send it as X-API-KEY).
# ROAMSAFE_ADMIN_KEY - ingestion and maintenance under /api/admin. These write,
#                      delete and auto-approve safety data: keep it distinct
#                      from the partner key and give it to nobody external.
roamsafe.api.key=${ROAMSAFE_API_KEY:}
roamsafe.admin.key=${ROAMSAFE_ADMIN_KEY:}

# Standing admin/test account, created on startup from the environment.
# Unset means no admin account is created - never commit real values here.
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
